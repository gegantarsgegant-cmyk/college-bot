{% extends "admin/_base.html" %}
{% block title %}Галерея{% endblock %}
{% block content %}
<h1>Галерея</h1>

<div class="card">
  <h2>Добавить фото</h2>
  <form method="post" action="/admin/gallery/new" enctype="multipart/form-data">
    <div class="form-row">
      <div class="form-group"><label>Подпись</label><input type="text" name="title"></div>
      <div class="form-group"><label>Файл</label><input type="file" name="image" accept="image/*" required></div>
      <div class="form-group"><label>Сортировка</label><input type="number" name="sort_order" value="0"></div>
      <div class="form-group"><label><input type="checkbox" name="published" checked> Опубликовать</label></div>
    </div>
    <button class="btn">Загрузить</button>
  </form>
</div>

<div class="card">
  {% if items %}
  <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:12px;">
    {% for g in items %}
    <div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;">
      <img src="{{ g.image_url }}" style="width:100%;height:140px;object-fit:cover;display:block;">
      <div style="padding:8px;font-size:0.85rem;">
        <div>{{ g.title }}</div>
        <form method="post" action="/admin/gallery/{{ g.id }}/delete" style="margin-top:6px;" onsubmit="return confirm('Удалить?')">
          <button class="btn btn-danger" style="font-size:0.78rem;padding:4px 10px;">Удалить</button>
        </form>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}<div style="color:#888;">Пусто.</div>{% endif %}
</div>
{% endblock %}
