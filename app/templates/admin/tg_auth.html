<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Админ-панель колледжа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f0f10; color: #e8e8e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { display: flex; align-items: center; justify-content: center; height: 100%; padding: 24px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; background: #1a1a1c; border: 1px solid #2a2a2c; border-radius: 16px; padding: 28px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #d4af37; }
    p { color: #bbb; line-height: 1.5; }
    .err { color: #ff6b6b; }
    a.btn { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 10px; background: #d4af37; color: #111; text-decoration: none; font-weight: 600; }
    .spin { display: inline-block; width: 24px; height: 24px; border: 3px solid #2a2a2c; border-top-color: #d4af37; border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="spin" style="margin-bottom: 12px;"></div>
      <h1>Авторизация...</h1>
      <p id="msg">Подождите, проверяем доступ через Telegram.</p>
    </div>
  </div>
  <script>
    (async function () {
      const card = document.getElementById('card');
      const msg = document.getElementById('msg');
      const tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.initData) {
        card.innerHTML = '<h1>Откройте через Telegram</h1>' +
          '<p>Эта страница работает только внутри Telegram Mini App. ' +
          'Если вы хотите войти из браузера — используйте обычный логин.</p>' +
          '<a class="btn" href="/admin/login">Войти по логину</a>';
        return;
      }
      tg.expand && tg.expand();
      tg.ready && tg.ready();
      try {
        const res = await fetch('/admin/tg/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'init_data=' + encodeURIComponent(tg.initData),
          credentials: 'same-origin',
        });
        if (res.ok) {
          window.location.replace('/admin/');
          return;
        }
        const text = await res.text();
        card.innerHTML = '<h1>Доступ запрещён</h1>' +
          '<p class="err">' + (text || 'Вы не в списке администраторов.') + '</p>' +
          '<a class="btn" href="/admin/login">Войти по логину</a>';
      } catch (e) {
        card.innerHTML = '<h1>Ошибка</h1><p class="err">' + (e.message || e) + '</p>';
      }
    })();
  </script>
</body>
</html>
