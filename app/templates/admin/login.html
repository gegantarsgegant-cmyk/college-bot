{% extends "admin/_base.html" %}
{% block title %}Вход{% endblock %}
{% block content_anon %}
<div style="min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px; background: linear-gradient(135deg, var(--gold), #8a6b1e); display: grid; place-items: center; font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; color: var(--ink); box-shadow: 0 8px 22px rgba(201,161,74,0.35);">Х</div>
      <h1 class="page-title" style="margin: 0;">Админ-панель</h1>
      <div class="page-subtitle">Библейский Колледж ХВЕ</div>
    </div>
    {% if error %}<div class="error">Неверный логин или пароль</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width: 100%; justify-content: center;">Войти</button>
    </form>
    <div style="text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--muted);">
      Если открываете в Telegram — <a href="/admin/tg">войти автоматически</a>
    </div>
  </div>
</div>
{% endblock %}
