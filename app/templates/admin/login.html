{% extends "admin/_base.html" %}
{% block title %}Вход{% endblock %}
{% block content_anon %}
<div style="min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;">
  <div class="card" style="max-width: 400px; width: 100%;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 64px; height: 64px; margin: 0 auto 14px; display: grid; place-items: center;"><img src="/static/img/logo-gold.svg" alt="ХДН" style="width:100%;height:100%;object-fit:contain;filter: drop-shadow(0 6px 18px rgba(201,161,74,0.4));"></div>
      <h1 class="page-title" style="margin: 0;">Админ-панель</h1>
      <div class="page-subtitle">Библейский Колледж ХВЕ</div>
    </div>
    {% if error %}<div class="error">Неверный логин или пароль</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width: 100%; justify-content: center;">Войти</button>
    </form>
    <div style="text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--muted);">
      Если открываете в Telegram — <a href="/admin/tg">войти автоматически</a>
    </div>
  </div>
</div>
{% endblock %}
