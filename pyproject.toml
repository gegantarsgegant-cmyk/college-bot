[project]
name = "college-bot"
version = "0.1.0"
description = "Bible College ХВЕ — website with Telegram bot and mini admin"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<0.140",
    "uvicorn[standard]>=0.32,<0.40",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.19",
    "sqlalchemy>=2.0.36,<2.1",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.7",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "aiogram>=3.15,<3.16",
    "aiohttp>=3.10,<3.11",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501", "B008", "N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"app/bot/handlers.py" = ["E402"]
